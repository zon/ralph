name: Container Build

on:
  push:
    branches:
      - main
      - dev

permissions:
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      alias: ${{ steps.version.outputs.ALIAS }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: version
        run: |
          BASE_VERSION="$(cat internal/version/VERSION)"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            VERSION="${BASE_VERSION}"
            ALIAS="latest"
          else
            VERSION="${BASE_VERSION}-dev"
            ALIAS="dev"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "ALIAS=${ALIAS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/ralph/Containerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.ALIAS }}
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The Go toolchain image layers on the Ralph image this run just pushed.
  build-go:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Go image
        uses: docker/build-push-action@v7
        with:
          context: containers/ralph-go
          file: containers/ralph-go/Containerfile
          push: true
          build-args: |
            RALPH_VERSION=${{ needs.build.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}-go:${{ needs.build.outputs.alias }}
            ghcr.io/${{ github.repository }}-go:${{ needs.build.outputs.version }}
          cache-from: type=gha,scope=go
          cache-to: type=gha,mode=max,scope=go
