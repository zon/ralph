name: Container Build

on:
  push:
    branches:
      - main
      - dev

permissions:
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      alias: ${{ steps.version.outputs.ALIAS }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: version
        run: |
          BASE_VERSION="$(cat internal/version/VERSION)"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            VERSION="${BASE_VERSION}"
            ALIAS="latest"
          else
            VERSION="${BASE_VERSION}-dev"
            ALIAS="dev"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "ALIAS=${ALIAS}" >> "$GITHUB_OUTPUT"

      # Load the image into the local daemon so the scan inspects exactly the
      # image that the push step publishes.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/ralph/Containerfile
          load: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.ALIAS }}
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.ALIAS }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Push image
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          ALIAS: ${{ steps.version.outputs.ALIAS }}
        run: |
          set -euo pipefail
          docker push "ghcr.io/${REPOSITORY}:${ALIAS}"
          docker push "ghcr.io/${REPOSITORY}:${VERSION}"

  # The Go toolchain image layers on the Ralph image this run just pushed.
  build-go:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Go image
        uses: docker/build-push-action@v7
        with:
          context: containers/ralph-go
          file: containers/ralph-go/Containerfile
          load: true
          build-args: |
            RALPH_VERSION=${{ needs.build.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}-go:${{ needs.build.outputs.alias }}
            ghcr.io/${{ github.repository }}-go:${{ needs.build.outputs.version }}
          cache-from: type=gha,scope=go
          cache-to: type=gha,mode=max,scope=go

      - name: Scan Go image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}-go:${{ needs.build.outputs.alias }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Push Go image
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          ALIAS: ${{ needs.build.outputs.alias }}
        run: |
          set -euo pipefail
          docker push "ghcr.io/${REPOSITORY}-go:${ALIAS}"
          docker push "ghcr.io/${REPOSITORY}-go:${VERSION}"
