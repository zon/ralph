name: Version Tag

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths:
      - internal/version/VERSION

permissions:
  contents: write

env:
  TAP_REPOSITORY: ${{ github.repository_owner }}/homebrew-tap

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          BASE_VERSION="$(cat internal/version/VERSION)"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            VERSION="${BASE_VERSION}"
          else
            VERSION="${BASE_VERSION}-dev"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "Tag v${VERSION} already exists." >> "$GITHUB_STEP_SUMMARY"
          else
            git tag -a "v${VERSION}" -m "Ralph v${VERSION}"
          fi
          git push origin "refs/tags/v${VERSION}"

      - name: Create GitHub release
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          PRERELEASE: ${{ github.ref != 'refs/heads/main' && '--prerelease' || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists." >> "$GITHUB_STEP_SUMMARY"
          else
            gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" \
              --title "Ralph v${VERSION}" \
              --generate-notes ${PRERELEASE}
          fi

      - name: Compute source archive checksum
        id: checksum
        if: github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/refs/tags/v${VERSION}"
          for attempt in $(seq 1 30); do
            if curl -fsSL -o ralph.tar.gz "$url"; then
              break
            fi
            sleep 5
          done
          test -s ralph.tar.gz
          echo "SHA256=$(shasum -a 256 ralph.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Point Homebrew tap at the new tag
        if: github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          SHA256: ${{ steps.checksum.outputs.SHA256 }}
          TAP_SSH_KEY: ${{ secrets.TAP_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$TAP_SSH_KEY" > ~/.ssh/tap_deploy
          chmod 600 ~/.ssh/tap_deploy
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone "git@github.com:${TAP_REPOSITORY}.git" tap
          cd tap
          sed -i -E "s|url \"https://github.com/[^\"]*/archive/refs/tags/v[^\"]*\"|url \"https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/v${VERSION}.tar.gz\"|" ralph.rb
          sed -i -E "s|sha256 \"[0-9a-f]{64}\"|sha256 \"${SHA256}\"|" ralph.rb
          ruby -c ralph.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ralph.rb
          if git diff --cached --quiet; then
            echo "Homebrew tap already points at v${VERSION}." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "chore: point ralph at v${VERSION}"
            git push origin main
          fi

      - name: Summarize release
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          echo "Released v${VERSION}: https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}" >> "$GITHUB_STEP_SUMMARY"
