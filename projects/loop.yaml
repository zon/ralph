- '`ralph loop` takes an optional slug argument, repeatable `--step` flags, and a `--max` flag that defaults to 10. It returns a usage error when neither a slug nor at least one `--step` is given, and rejects a non-positive `--max` before any execution begins.'
- '`.ralph/config.yaml` accepts a `loops:` section whose entries each have a `slug` and a `steps` list. When a slug is given, `ralph loop` uses the entry whose `slug` matches and embeds its `steps` in the prompt, returning `loop config not found: <slug>` when none matches. Document the new section in `examples/config.example.yaml` and `docs/config.md`.'
- When at least one `--step` is passed, `ralph loop` uses those steps in order in place of the config entry's `steps`. When steps are given without a slug, the command asks the AI to read the steps and propose a slug for the branch, and returns an error when the AI produces no usable slug.
- '`ralph loop` builds a prompt that embeds the resolved steps and instructs the agent to follow them, write a brief summary of what it did to `report.md`, and write exactly `NOTHING_TO_DO` to `report.md` when nothing was necessary.'
- '`ralph loop` runs the prompt as an iteration loop. Each iteration invokes the AI and reads `report.md`. The loop stops when the report equals `NOTHING_TO_DO` (trimmed) or after `--max` iterations, whichever comes first.'
- After each iteration whose report is not `NOTHING_TO_DO`, `ralph loop` commits the changes with the report content as the commit message, deletes `report.md`, and pushes to the `loop-<slug>` branch, creating it from the current branch when it does not exist. An iteration whose report is `NOTHING_TO_DO` is not committed.
- When the loop ends, `ralph loop` opens a pull request from `loop-<slug>` to the branch it was created from, but only when at least one commit was made on the branch. When no commits were made it exits successfully without opening a pull request.
- Apply a semver minor bump to the app version.
