# The --branch option on `ralph prompt`. Design: `docs/design/prompt.md`.
# Spec: `specs/ralph/prompt.md`, "Prompt branch".
#
# A caller that runs prompts unattended, such as a launcher that submits a
# remote prompt for each dependency update, needs a branch name it chose, and
# no AI call before the run starts.
- '`ralph prompt --branch <name>` uses the name as written for the prompt branch, in `local`, `worktree` and `remote` modes. It does not clean the name up, so `update/run-1` stays `update/run-1`.'
- '`ralph prompt --branch <name>` asks the AI for no slug from the prompt. A run with `--branch` and no OpenCode credentials reaches the pass.'
- '`ralph prompt --branch <name>` fails before any branch, service or pass work when Git rejects the name, with an error that names the branch.'
- In `remote` mode, the submitted workflow's prompt branch is the `--branch` name, and the prompt branch lock uses it.
- The prompt branch is still renamed from the work before the pull request, and a pass that leaves no commits pushes nothing, with `--branch` as without.
- '`ralph prompt --help` and the command''s inline help list `--branch`.'
- Apply a semver minor bump to the Ralph version.
