- A `ralph loop` iteration whose agent pass leaves report.md missing or unreadable makes no commit, and the loop continues with the next iteration instead of returning an error, still bounded by the iteration cap
- When a PR summary or changelog prompt finishes without a usable deliverable, the same prompt is re-run up to three attempts before the command returns an error that names the attempt limit; a deliverable is unusable when its output file is missing or empty, and an opencode execution failure is not retried
- When a loop-slug prompt finishes without a usable slug, the same prompt is re-run up to three attempts before the command returns an error that names the attempt limit; a slug is unusable when the output file is missing or empty or the proposal fails slug validation, and an opencode execution failure is not retried
- When a picker prompt finishes without a usable selection, the same prompt is re-run up to three attempts before the command returns an error that names the attempt limit; a selection is unusable when picked-item-index.txt is missing, does not parse as an integer, or names an index outside the resolved item array, and an opencode execution failure is not retried
- When `extraIterations` is unset, the default extra iteration count is 30% of the resolved item count, rounded up, and the `--extra` flag help and `ralph help config` text describe the 30% default
- Apply a semver patch bump to the app version
