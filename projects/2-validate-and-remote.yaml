slug: 2-validate-and-remote
title: '2/2: Make validate schemaless, carry the item query into remote runs, and delete the requirement model'
feature: specs/features/ralph/validate
requirements:
    - slug: validate-checks
      description: Validation checks that the file parses, the query evaluates, and the query yields items — and nothing else
      items:
        - Validation performs exactly three checks, in order — the file parses as YAML or JSON, the item query evaluates against the parsed document without error, and the query resolves to at least one item
        - There is no schema check — no field is required and no field is rejected
        - A query that cannot be evaluated exits non-zero reporting the query error, without invoking an agent
        - 'A query that produces no output exits non-zero with `item query yielded no items: <query>`, without invoking an agent'
      scenarios:
        - title: Well-formed project
          items:
            - GIVEN a file that parses and whose query resolves to one or more items
            - WHEN `ralph validate <file>` is run
            - THEN all three checks pass on the first attempt
            - AND no agent is invoked
        - title: Unrecognized fields accepted
          items:
            - GIVEN a file that parses and yields items but contains fields ralph does not read
            - WHEN `ralph validate <file>` is run
            - THEN validation succeeds and the unrecognized fields are left untouched
        - title: Items with no conventional shape accepted
          items:
            - GIVEN a file whose top level is an array of plain strings
            - WHEN `ralph validate <file>` is run with the default query
            - THEN validation succeeds, because each string is a valid item
        - title: Query evaluation failure
          items:
            - GIVEN a file that parses and a query that cannot be evaluated against it
            - WHEN `ralph validate <file>` is run
            - THEN the command exits with a non-zero status reporting the query error
            - AND no agent is invoked, because the file is not the thing that is wrong
        - title: Query yields no items
          items:
            - GIVEN a file that parses and a query that produces no output
            - WHEN `ralph validate <file>` is run
            - 'THEN the command exits with a non-zero status and the error names the query - `item query yielded no items: <query>`'
            - AND no agent is invoked
      passing: true
    - slug: validate-items-flag
      description: Validate resolves the item query exactly as a run does
      items:
        - '`ralph validate` accepts an `--items` flag holding the jq query that selects the item array'
        - The query resolves as flag, then the config `items` field, then `.`, matching the resolution a run uses
      scenarios:
        - title: '`--items` flag takes precedence'
          items:
            - 'GIVEN `items: .requirements` is set in `.ralph/config.yaml`'
            - AND the user runs `ralph validate <file> --items '.spec.tasks'`
            - WHEN the item query is resolved
            - THEN `.spec.tasks` is evaluated against the parsed file
        - title: Config query used when no flag is passed
          items:
            - 'GIVEN `items: .requirements` is set in `.ralph/config.yaml`'
            - AND no `--items` flag is passed
            - WHEN the item query is resolved
            - THEN `.requirements` is evaluated against the parsed file
        - title: Default query when flag and config are unset
          items:
            - GIVEN `items` is not set in `.ralph/config.yaml`
            - AND no `--items` flag is passed
            - WHEN the item query is resolved
            - THEN the query `.` is evaluated, so a file whose top level is an array validates with no configuration
      passing: true
    - slug: validate-fix-loop
      description: The bounded AI fix loop repairs parse failures only
      items:
        - The fix loop is entered only when the file fails to parse, never for a query error or an empty result
        - Each attempt reports the underlying parse error before invoking the agent
        - The agent runs locally on the current machine, on the same path used by a local run, and is never delegated to a remote runner
        - The loop is capped at 10 total parse attempts — the initial attempt plus up to 9 agent-assisted retries
        - Exceeding the cap exits non-zero reporting that the 10-attempt limit was reached, including the final parse error
        - After the loop exits, the query checks run against the repaired file, and a query that yields no items fails without re-entering the loop
      scenarios:
        - title: Agent fixes a malformed file
          items:
            - GIVEN a file whose contents do not parse as YAML or JSON
            - WHEN `ralph validate <file>` is run
            - THEN the command invokes the agent with the file path and the parse error
            - AND the agent rewrites the file
            - AND the command retries parsing against the updated file
        - title: Query checks run after the file parses
          items:
            - GIVEN a file that the agent repairs into valid YAML
            - WHEN the fix loop exits
            - THEN the item query is evaluated against the repaired file
            - AND a query that yields no items fails validation without re-entering the fix loop
        - title: File becomes parseable within the limit
          items:
            - GIVEN a file that the agent successfully repairs within 10 attempts
            - WHEN `ralph validate <file>` is run
            - THEN the loop exits as soon as parsing succeeds
            - AND the command proceeds to the query checks
        - title: Limit exceeded
          items:
            - GIVEN a file the agent cannot repair
            - WHEN `ralph validate <file>` is run
            - THEN the command exits with a non-zero status
            - AND the error message reports that the 10-attempt limit was reached
            - AND the error message includes the final parse error
      passing: true
    - slug: validate-canonical-rewrite
      description: The canonical rewrite preserves the whole document, normalizing only formatting
      items:
        - The rewrite writes the parsed document back as YAML, preserving its full content and key order
        - Validation composes the file reader's parse, query, and write operations rather than performing any of them itself
        - No field is dropped for being unrecognized and no field is added
        - A file already in canonical YAML is rewritten byte-identically
        - A `.json` input is written to a new file with the same name and a `.yaml` extension, and the original `.json` file is removed
        - The rewrite no longer marshals a typed project model, so empty and nil field omission rules no longer apply
      scenarios:
        - title: File rewritten in canonical format
          items:
            - GIVEN a project file that validates (immediately or after agent fixes)
            - WHEN `ralph validate <file>` finishes validation
            - THEN the file is rewritten as canonical YAML
            - AND the on-disk content parses to the same document as the input
        - title: Unrecognized fields survive the rewrite
          items:
            - GIVEN a project file containing fields ralph does not read
            - WHEN the file is rewritten in canonical format
            - THEN those fields are present in the output with their original values
        - title: JSON file renamed to YAML
          items:
            - GIVEN a project file with a `.json` extension that validates
            - WHEN `ralph validate <file>` finishes validation
            - THEN the document is written to a new file with the same name but a `.yaml` extension
            - AND the original `.json` file is removed
        - title: Already-canonical YAML file is unchanged
          items:
            - GIVEN a project file already in canonical YAML form
            - WHEN `ralph validate <file>` rewrites it
            - THEN the resulting file content is byte-identical to the input
      code:
        - name: WriteCanonical
          description: writes a parsed document back to disk as canonical YAML, preserving its content and key order
          module: internal/projectfile
          body: |
            // Writing a document parsed from a .json path produces a sibling .yaml
            // file; removing the original is the caller's decision.
            func WriteCanonical(path string, doc *Document) error
      passing: true
    - slug: validate-output
      description: A successful validation reports the file path and item count
      items:
        - Validation is a convenience and not a precondition — a project file that has never been validated is runnable, and a run reports the same query errors
      scenarios:
        - title: Valid project file
          items:
            - GIVEN a project file that ends up valid (with or without agent fixes)
            - WHEN `ralph validate <file>` finishes
            - THEN the command exits with status code 0
            - AND a message confirms the project is valid and reports the file path and its item count
        - title: Foreign project file run without validation
          items:
            - GIVEN a project file owned by another tool, whose formatting must not be rewritten
            - WHEN the user runs ralph against it without validating first
            - THEN the run resolves items normally and the file is not reformatted
      passing: true
    - slug: workflow-run-item-flags
      description: The container-side workflow run command accepts the item query and cleanup setting as flags
      items:
        - '`ralph workflow run` accepts `--items` and uses that query to resolve the item array'
        - '`ralph workflow run` accepts `--cleanup` and passes it through to the local execution behavior'
        - Input validation after workspace setup fails before base-branch synchronization when the project file is missing, does not parse, or yields no items under the supplied query
      scenarios:
        - title: Item query
          items:
            - GIVEN `--items` is provided with the query resolved at submission time
            - WHEN the project loop executes
            - THEN that query is used to resolve the item array
            - AND the `items` field in `.ralph/config.yaml` is not consulted
        - title: Cleanup
          items:
            - GIVEN `--cleanup` is provided
            - WHEN every item is complete
            - THEN the project file is deleted and the deletion committed on its own before the pull request is opened
            - AND when `--cleanup` is absent, the project file is left in place
        - title: Project file load failure
          items:
            - GIVEN the project file at the provided path is missing, does not parse, or yields no items under the supplied item query
            - WHEN validation runs after the workspace is ready
            - THEN an error is returned before base-branch synchronization begins
      passing: true
    - slug: remote-workflow-arguments
      description: The generated workflow manifest carries the locally resolved item query and cleanup setting
      items:
        - The item query is resolved locally before submission and always passed explicitly, so the container never re-resolves it from the repository config
        - The cleanup flag appears in the container args only when cleanup is enabled
      scenarios:
        - title: Resolved item query passed as `--items` argument
          items:
            - GIVEN the item query resolved locally to `.requirements`
            - WHEN the workflow YAML is generated
            - THEN the container args for `ralph workflow run` include `--items .requirements`
        - title: Default query passed explicitly
          items:
            - GIVEN neither `--items` nor `items` in `.ralph/config.yaml` is set, so the query resolves to `.`
            - WHEN the workflow YAML is generated
            - THEN the container args include `--items .`, so the container does not re-resolve the query
        - title: Config change after submission does not affect the run
          items:
            - GIVEN a workflow has been submitted carrying `--items .requirements`
            - AND `.ralph/config.yaml` is later changed on the branch
            - WHEN the container runs
            - THEN it resolves items with `.requirements` as submitted
        - title: Cleanup enabled
          items:
            - GIVEN cleanup resolved to enabled before workflow submission
            - WHEN the workflow YAML is generated
            - THEN the container args for `ralph workflow run` include `--cleanup`
        - title: Cleanup disabled
          items:
            - GIVEN cleanup resolved to disabled
            - WHEN the workflow YAML is generated
            - THEN the container args contain no `--cleanup` flag
      passing: false
    - slug: remove-requirement-model
      description: The typed requirement model and every helper built on it are deleted
      items:
        - This deletion is only possible once project 1-items-end-to-end has landed, because it migrated the last callers of the model; attempting it earlier leaves the repository unable to compile
        - The requirement, scenario, and code entry value types are deleted along with the project schema validation that enforced them
        - Saving a typed project model back to YAML is no longer supported, since the only remaining writer preserves the parsed document instead
        - Counting passing and failing requirements is no longer supported anywhere
        - No Go source file, embedded instruction template, or test refers to a requirement's passing field
        - Tests covering the deleted helpers are removed rather than adapted, and the remaining suite passes
      passing: false
    - slug: version-bump
      description: Version bump
      items:
        - Apply a semver minor bump to the app version, because validate gains a flag and stops enforcing a schema while remaining compatible with valid files
        - Apply the matching app version to the ralph-webhook chart and a patch bump to the chart version
      passing: false
