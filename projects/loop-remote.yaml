- '`ralph loop` accepts `--local` and `--follow` flags. Without `--local` it submits an Argo Workflow by default and the loop runs inside the workflow container; with `--local` it runs the loop in-process on the local machine without submitting a workflow. It rejects `--follow` together with `--local` with the error `--follow flag is not applicable with --local flag` before any execution begins.'
- '`ralph loop` resolves the AI model and Kubernetes context the same way `ralph run` does: `--model` overrides the top-level `model` field in `.ralph/config.yaml`, which defaults to `deepseek/deepseek-chat` when unset, and `--context` overrides the Kubernetes context used for workflow submission.'
- 'Before submitting a workflow, `ralph loop` verifies the current branch is in sync with the remote, returning an error when it has not been pushed or local and remote differ at the current commit. The submitted workflow carries the resolved slug and steps into the container, is labeled `app.kubernetes.io/managed-by=ralph`, prints its workflow name, and prints the `argo logs` command the user can run to follow it.'
- 'The loop workflow container prepares the workspace and runs the in-process loop with the submitted slug and steps, so the loop body — slug and step resolution, prompt construction, iteration, commit and push to `loop-<slug>`, and pull request opening — behaves identically to `--local`.'
- '`ralph loop --follow` streams the submitted workflow logs and waits for the workflow to finish, sending a success or error desktop notification for the slug on completion, suppressed by `--no-notify` as in `ralph run`.'
- Apply a semver minor bump to the app version.
