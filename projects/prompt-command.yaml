# Implement `ralph prompt` from `specs/ralph/prompt.md`.
#
# Why. The prompt command is specified and documented, but no code exists. It
# runs one user-supplied prompt as a single OpenCode pass on a branch named
# from the prompt slug, then pushes and opens a pull request when the pass
# leaves commits. It has no project items, iteration cap, report contract, or
# completion trailer.
#
# Where things are. Register the command in `internal/cmd/cmd.go` and follow
# the CLI shape of `internal/cmd/run.go` and `internal/cmd/loop.go`. Mode,
# base, worktree, and branch flow patterns live in
# `internal/orchestration/run/cmd.go` and `internal/orchestration/loop/cmd.go`.
# Before commands, base synchronization, services, and the agent pass live in
# `internal/orchestration/run/runner.go` and `internal/services/client.go`.
# AI entry points are in `internal/ai/ai.go` (`RunAgent`, `RunAgentPrimary`,
# `ProposeLoopSlug`, `GeneratePRSummary`) with instruction files in
# `internal/ai/`. Git branch and worktree operations are in `internal/git/`.
# Pull request creation is in `internal/github/client.go` and
# `internal/github/pr.go`. Workflow generation is in
# `internal/workflow/generate.go`, with submission patterns in
# `internal/cmd/command.go` and `internal/cmd/workflow_client.go`. Container
# entrypoints are in `internal/cmd/workflow.go`, `internal/cmd/workflow_loop.go`,
# `internal/orchestration/loop/workflow.go`, and
# `internal/orchestration/workspace/workspace.go`. Tests follow
# `docs/testing.md`.
#
# Applying. Nothing here touches a cluster until the remote requirements. A
# local prompt changes only the current checkout and leaves its uncommitted
# changes in place when it makes no commits.
- '`ralph prompt` is a top-level command listed by `ralph --help`. It takes the prompt from positional text joined with single spaces, from `--file <path>`, or from standard input when neither positional text nor `--file` is given and standard input is not a terminal. `--file -` reads standard input even when it is a terminal. Positional text with `--file` fails, and a missing, unreadable, empty, or whitespace-only prompt fails before any mode work starts. A prompt beginning with `-` is accepted after `--`. The command exposes `--mode`, `--base` (`-B`), `--model`, `--variant`, `--agent`, `--context`, `--namespace` (`-n`), `--no-services`, `--no-follow`, `--no-notify`, `--debug <branch>`, and `--verbose`, and rejects `--items` and `--extra`. `--debug` fails in `local` and `worktree` modes. Tests cover every input source, the conflicting and empty inputs, the leading-dash form, the option surface, and the debug rejection.'
- '`ralph prompt` resolves the execution mode from `--mode`, then `mode` in `.ralph/config.yaml`, then `local`, and rejects any other value before doing work. It resolves the base branch from `--base`, then the current branch when that differs from the prompt branch, then `defaultBranch` in `.ralph/config.yaml`, and resolves it once for both the pre-pass synchronization and the pull request target. Tests cover every mode level, an invalid mode, every base level, and the case where the current branch is already the prompt branch.'
- '`ralph prompt` asks the AI for a short slug from the prompt, cleans it like a project branch, and uses it as the prompt branch name. A failed slug proposal fails the command before any branch, service, or pass work starts. In `local` mode it checks out the prompt branch in the current checkout, creating it from the current branch when it does not exist. In `worktree` mode it creates a worktree on the prompt branch, refuses a branch already checked out in another worktree, and removes the worktree when the command ends. The starting checkout stays on its original branch in worktree mode. Tests cover slug cleanup, a failed proposal, creating and switching to the branch, and the worktree refusal and cleanup.'
- Before the pass, `ralph prompt` runs the configured before commands once, checks out the prompt branch, synchronizes the base branch, and starts the configured services. Before commands run before the branch switch in `local` and `remote` modes and inside the new worktree in `worktree` mode. A required before command failure fails the command, and an optional failure warns and continues. A service that fails to start or become healthy runs the service-fix prompt before the pass. A successful fix continues the pass without services, and a failed fix fails the command. `--no-services` skips service startup and the fix prompt while still running the before commands. Tests cover the order, both before-command outcomes, both service-fix outcomes, and `--no-services`.
- The prompt runs as one non-interactive OpenCode pass with the prompt text as written, using the configured model, variant, and agent. Custom instructions do not apply. The direct prompt, service fix, and conflict resolution use the configured agent, while the slug and pull request summary use OpenCode's primary agent. The command has no item picker, development prompt, changelog, report contract, block detection, completion trailer, iteration recovery, or iteration cap. It reads no report, and it does not restrict the agent's tools. Each invocation starts a fresh OpenCode session. A non-zero OpenCode exit fails the command, and a local or worktree pass can be canceled with Ctrl-C. Tests cover the single pass, the agent and custom-instruction rules, the absence of a report read, tool access, and a failing pass.
- '`ralph prompt` records the prompt branch tip after base synchronization and compares it after a successful pass. When the tip did not advance, the command succeeds without a push or pull request, and uncommitted changes remain in a `local` checkout and are discarded in `worktree` and `remote` modes. When the tip advanced, it synchronizes the base branch again and pushes the prompt branch. A failed pass makes no push. Tests cover both tip outcomes, the second synchronization, the push, and the uncommitted-change handling in every mode.'
- After the prompt branch is pushed, `ralph prompt` generates the pull request description from the commit log with the prompt text in place of a project description, and opens a pull request to the base branch. The title is the first H1 in the summary, falling back to the prompt slug. A summary or pull request failure fails the command and leaves the pushed branch. In `local` mode the starting branch is restored after the pull request, and `worktree` mode leaves the starting checkout untouched. Tests cover the summary input, the title fallback, a failure after a push, and branch restoration.
- In `remote` mode, `ralph prompt` fails before submission when the current branch is missing on the remote or differs from it, and it does not send uncommitted changes. It resolves the slug, prompt branch, and base branch locally, and reads a prompt from a file or standard input locally before sending it as text. It generates a `ralph-prompt-` Argo Workflow that carries the Ralph label, the configured image, mounts, environment, labels, resources, context, and namespace, the same TTL and pod garbage collection as the other workflows, the prompt branch lock, and the prompt as one container argument. `--debug <branch>` runs Ralph from that source branch inside the container. Tests cover the branch-sync rejection, local prompt resolution, the generated name and label, the single prompt argument, the configured options, the lock, and debug mode.
- A remote prompt follows workflow logs by default and waits for completion. `--no-follow` submits and returns with the workflow name and an `argo logs` hint. A followed workflow sends a completion notification unless `--no-notify` is set. Stopping the local command does not stop the workflow. A followed failure exits non-zero, and a submission without follow exits zero once the workflow is accepted. Tests cover the default follow, the no-follow output, notification suppression, the detached workflow, and both exit codes.
- '`ralph workflow prompt` is the container entrypoint. It validates the prompt before preparing the workspace, then prepares the workspace, creates or checks out the prompt branch in the cloned repository, and runs the same setup, services, pass, commit, and pull request flow. It accepts the branch, base, prompt, model, variant, agent, and `--no-services` from the workflow. A missing or empty prompt fails before workspace setup. Tests cover the entrypoint command, the validation order, workspace branch creation, the carried options, and `--no-services`.'
- Apply a semver minor bump to the app version.
