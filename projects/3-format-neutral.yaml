slug: 3-format-neutral
title: Make ralph project-format and coding-practice neutral
requirements:
    - slug: install-spec-standards
      description: The spec formats and coding standards are consumed as installed documents rather than owned by ralph
      items:
        - The documents published by the specs repository are present at `docs/specs/`, installed by `just install` from a checkout of that repository rather than authored here
        - If no local checkout is available, each document is fetched from `https://raw.githubusercontent.com/zon/specs/refs/heads/main/docs/specs/<name>.md` into `docs/specs/<name>.md`, preserving its contents byte for byte
        - The installed set is `README.md`, `spec.md`, `orchestration.md`, `architecture.md`, `project.md`, `code.md`, `testing.md`, `glossary.md`, `requirements.md`, `prompts.md`, and `outline.md`
        - AGENTS.md points at `docs/specs/code.md` for the coding standard and `docs/specs/testing.md` for the testing standard, replacing its references to `docs/code.md` and `docs/testing.md`
        - AGENTS.md states that `docs/specs/` is installed, not authored here, and that changes to those documents belong in the specs repository
        - No installed document is edited to suit this repository; repository-specific rules stay in AGENTS.md
      scenarios:
        - title: Installed standards are reachable from the agent instructions
          items:
            - GIVEN a fresh clone of the repository
            - WHEN an agent follows AGENTS.md to find the coding standard
            - THEN it is directed to `docs/specs/code.md` and that file exists
    - slug: remove-format-docs
      description: The spec, orchestration, architecture, and standards documents no longer live in ralph
      items:
        - '`docs/formats/README.md`, `docs/formats/specs.md`, `docs/formats/orchestration.md`, and `docs/formats/architecture.md` are deleted'
        - '`docs/code.md`, `docs/testing.md`, `docs/writing-requirements.md`, and `docs/prompts.md` are deleted'
        - '`docs/outline/specs.md` is deleted and the now-empty `docs/outline/` directory is removed'
        - Every remaining reference in the repository to a deleted path is repointed at its `docs/specs/` equivalent or removed, including in AGENTS.md, README.md, and any spec under `specs/features/`
        - No file in the repository links to a path under `docs/formats/`, `docs/outline/`, `docs/code.md`, `docs/testing.md`, `docs/writing-requirements.md`, or `docs/prompts.md`
      scenarios:
        - title: No dangling references to removed documents
          items:
            - GIVEN the documents have been deleted
            - WHEN the repository is searched for links to their old paths
            - THEN no match is found outside of git history
    - slug: project-mechanics-doc
      description: Ralph documents how it resolves a project file, not what a project file should contain
      items:
        - '`docs/formats/project.md` is replaced by `docs/projects.md`, and the `docs/formats/` directory is removed'
        - '`docs/projects.md` keeps only the mechanics ralph implements: what a project file is, the item query and its resolution rules, item index and item key, the optional `slug` and `title` metadata, the absence of completion state in the file, choosing a query for foreign files, and validation'
        - The conventional item shape, the `requirements`/`items`/`scenarios`/`code`/`tests` field reference, the guidance on writing items, the code and test entry rules, the version bump levels, and the worked example are all removed rather than reworded
        - '`docs/projects.md` states that the conventional shape is defined outside ralph and links to `docs/specs/project.md` for it'
        - The document does not tell the reader what to put in a project file beyond what ralph reads from it — an item query resolving to a non-empty array
        - '`docs/iterations.md`, `README.md`, and every other reference to `docs/formats/project.md` point at `docs/projects.md`, with section anchors updated to sections that still exist'
      scenarios:
        - title: Mechanics survive the split
          items:
            - GIVEN `docs/projects.md`
            - WHEN a reader looks for how an item index is assigned
            - THEN the resolution rules and the dropping of empty outputs are still documented
        - title: Opinion does not survive the split
          items:
            - GIVEN `docs/projects.md`
            - WHEN a reader looks for the `requirements` list or a `code` entry
            - THEN the document defers to `docs/specs/project.md` instead of describing them
    - slug: trim-glossary
      description: The ralph glossary defines only ralph's own runtime vocabulary
      items:
        - '`docs/glossary.md` keeps Project, Item, Item Query, Item Key, and Completion Trailer'
        - The Component, Deep Module, Feature, Implementation Module, Pure Module, and Orchestration Module entries are removed from `docs/glossary.md`
        - Any link in the repository to a removed glossary anchor points at `docs/specs/glossary.md` instead
        - The Project and Item entries no longer describe what a well-formed project should contain, only how ralph resolves and identifies them
    - slug: remove-skills
      description: Ralph ships no skills of its own
      items:
        - The directories `.claude/skills/ralph-write-spec/`, `.claude/skills/ralph-write-orchestration/`, `.claude/skills/ralph-write-architecture/`, `.claude/skills/ralph-write-project/`, `.claude/skills/ralph-write-skill/`, and `.claude/skills/ralph-review-module/` are deleted
        - The `.claude/skills/` directory is removed if nothing else remains in it
        - The "Ralph Skills" section of AGENTS.md, which documents the markdown-link rule for `rewriteLinks`, is removed
        - AGENTS.md notes that authoring skills are installed from the specs repository
    - slug: remove-set-skills
      description: The set skills command and its skill-fetching machinery are removed
      items:
        - The `Skills` field is removed from `SetCmd`, along with the `SetSkillsCmd` type and its `Run` method, so `ralph set` exposes only `config`
        - The `internal/skills` module is deleted in full, including `discover.go`, `fetch.go`, `install.go`, `prune.go`, `skills_mock.go`, and their tests
        - The `internal/orchestration/setup` module is deleted in full, including its tests
        - The `gitClient` helper in `internal/cmd/set.go` is removed if nothing else uses it, and the file's imports are reduced to what remains
        - The `internal/skills` and `internal/orchestration/setup` entries are removed from `specs/architecture.yaml`
        - '`ralph set --help` no longer lists a skills subcommand, and no test asserts that it does'
      scenarios:
        - title: Set exposes only config
          items:
            - GIVEN the build succeeds
            - WHEN `ralph set --help` is run
            - THEN the output lists `config` and does not mention skills
        - title: No references to the deleted modules remain
          items:
            - GIVEN the modules have been deleted
            - WHEN the repository is searched for imports of `internal/skills` or `internal/orchestration/setup`
            - THEN no match is found and the full test suite builds
    - slug: neutral-artifact-prompts
      description: Ralph's embedded prompts defer to the format documents installed in the target repository
      items:
        - '`internal/ai/write-orchestration-instructions.md` no longer names `docs/formats/orchestration.md`; it directs the agent to the orchestration format document installed in the repository, or to an installed orchestration-authoring skill, and to stop and report if neither is present'
        - '`internal/ai/write-project-instructions.md` no longer names `docs/formats/project.md` or the `ralph-write-project` skill; it directs the agent to whichever project format document or project-authoring skill the repository has installed'
        - '`internal/ai/project-fix-instructions.md` no longer fetches `https://raw.githubusercontent.com/zon/ralph/refs/heads/main/docs/formats/project.md`; its YAML quoting rules and repair instructions are unchanged, and its only stated requirement is that the repaired file parse and its item query resolve'
        - No embedded instruction template in `internal/ai/` names a document path that ralph itself is expected to ship
        - Tests asserting that a built prompt contains `docs/formats/orchestration.md` or `docs/formats/project.md` are updated to assert the new neutral wording rather than deleted
        - The `ralph run <spec-or-orchestration-file>` behavior is unchanged — an orchestration is still generated from a spec, and a project from either
      scenarios:
        - title: A spec input still produces a project
          items:
            - GIVEN a repository with a spec file and the format documents installed
            - WHEN ralph is run against that spec file
            - THEN an orchestration is generated, a project is generated from it, and the run proceeds
        - title: Prompts carry no ralph-owned paths
          items:
            - GIVEN the embedded instruction templates
            - WHEN they are searched for `docs/formats/`
            - THEN no match is found
    - slug: remove-architecture-schema
      description: Ralph holds no knowledge of the architecture document schema
      items:
        - The `internal/architecture` module is deleted in full, including `spec.go` and `spec_test.go`
        - '`migrateFeatureArchitecture` is removed from `internal/project`, along with its call from `performPostAgentCleanup` and the now-unused `feature` parameter if nothing else reads it'
        - Post-agent cleanup still removes service logs, normalizes the project file, and stages it — only the architecture migration is removed
        - '`internal/ai/architecture-instructions.md` and `internal/ai/architecture-fix-instructions.md` are deleted, along with their embed directives, the `architectureInstructions` and `architectureFixInstructions` variables, `BuildArchitecturePrompt`, `BuildArchitectureFixPrompt`, and the `ArchitecturePromptData` and `ArchitectureFixPromptData` types'
        - The tests for the deleted prompt builders are removed
        - The `internal/architecture` entry is removed from `specs/architecture.yaml`
        - No Go file in the repository reads or writes `specs/architecture.yaml`
      scenarios:
        - title: An iteration completes without touching the architecture document
          items:
            - GIVEN a project file with a `feature` field pointing at a feature directory containing an architecture document
            - WHEN an iteration completes
            - THEN the project file is staged and the architecture document is left untouched
    - slug: update-specs-index
      description: Ralph's own specs describe only the features it still has
      items:
        - '`specs/features/ralph/set-skills/spec.md` is deleted and its directory removed'
        - '`specs/features/ralph/write-project/spec.md` is deleted and its directory removed, since the project format it specifies is now defined outside ralph'
        - The `set-skills` and `write-project` entries are removed from `specs/README.md`
        - Any remaining spec that references a deleted document path, the removed skills, or the architecture migration is updated to match the new behavior
        - '`specs/features/ralph/validate/spec.md` states validation checks only that the file parses and the item query resolves to a non-empty item, with no reference to a project schema or format document'
    - slug: update-readme
      description: The README presents ralph as a runner with no opinion on project contents
      items:
        - The Project format link points at `docs/projects.md`
        - The nested-project example no longer implies a required `requirements`/`scenarios` shape, or is labelled explicitly as one convention among many
        - The README states that the spec, orchestration, architecture, and project conventions are published separately and links to the specs repository
        - The Installation section no longer mentions installing ralph skills, and the More section lists only documents that exist
      scenarios:
        - title: Every README link resolves
          items:
            - GIVEN the README
            - WHEN each relative link in it is checked
            - THEN every target file exists
    - slug: version-bump
      description: Version bump
      items:
        - Apply a semver major bump to the app version, updating `internal/version/VERSION` and `appVersion` in `charts/ralph-webhook/Chart.yaml` together
        - Apply a semver patch bump to the `version` field in `charts/ralph-webhook/Chart.yaml`
