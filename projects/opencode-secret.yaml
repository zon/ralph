# Let a repository point its workflow at a Secret other than the one
# developers write. Spec: `specs/ralph/workflow-workspace.md`'s "AI
# Credentials" and `specs/ralph/setup.md`'s "Sequential Namespace
# Preparation". Build to them.
#
# Why. A repository can give OpenCode its credential through configuration
# alone, such as an `options.apiKey` that is a `{file:...}` reference to the
# pod's own projected token for an AI gateway. Today every workflow mounts
# `opencode-credentials`, which `ralph setup` fills with the developer's own
# `auth.json`, so a developer's keys for every other provider ride along
# into the pod, and the mounted Secret cannot carry the configuration file
# itself. Naming a different Secret for the
# workflow, one that holds OpenCode's configuration and no `auth.json`,
# keeps developer keys out while `ralph setup` keeps working as it does.
#
# Where things are. `internal/config/config.go`'s `WorkflowConfig` holds the
# `workflow` fields and `validateWorkflowEnv` is the pattern for validating
# one. `internal/workflow/scripts.go`'s `buildCredentialVolumes` and
# `buildCredentialMounts` hardcode `k8s.OpenCodeSecretName`
# (`internal/k8s/secrets.go`) for the `/secrets/opencode` mount, and
# `internal/workflow/generate_test.go` and `scripts_test.go` assert the
# current names. `internal/cmd/setup.go` writes the Secret by that same
# constant, which stays the default and the name setup writes.
# `internal/workspace/workspace.go`'s `SetupOpenCodeCredentials` already
# copies `auth.json` only when the mount has one, so an empty Secret needs
# no change there. `internal/config/config.md`'s Workflow table is the
# inline help behind `ralph help config`; `docs/inline-help.md` governs it.
# Tests follow `docs/testing.md`: table-driven, no external calls.
#
# Applying. Nothing here touches a cluster. The consuming repository names
# the Secret in its own `.ralph/config.yaml` after the release.
- '`workflow.opencodeSecret` names the Secret the workflow mounts for OpenCode. It is a string field of `workflow` in `.ralph/config.yaml`. When omitted it resolves to `opencode-credentials`, so every existing configuration behaves as before. An empty string fails config validation with an error naming the field. The Workflow table in `ralph help config` documents it in one row, and a sentence below the table says `ralph setup` always writes `opencode-credentials` and that this field picks what the workflow mounts. Config load tests cover the default, a set value, an empty value, and a YAML round trip that keeps the value.'
- 'The workflow pod mounts the named Secret. With `workflow.opencodeSecret` set, the generated Workflow''s pod has a volume for that Secret mounted read-only at `/secrets/opencode` and no volume for `opencode-credentials`. With it unset, the pod is unchanged from today. The `github-credentials` mount is unaffected either way. Tests in `internal/workflow` assert the volume name, the mounted Secret name and the mount path in both cases.'
- '`ralph setup` says which Secret the workflow reads. When a namespace is targeted and `workflow.opencodeSecret` names a Secret other than `opencode-credentials`, setup still writes the developer''s `auth.json` to `opencode-credentials` and prints one line saying the workflow mounts the named Secret instead. When the names match, the output is unchanged. A test covers both.'
- 'Apply a semver minor bump to the version.'
