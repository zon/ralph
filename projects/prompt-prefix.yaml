- "`ralph prompt --prefix <prefix>` runs on the branch `<prefix>/<prompt-slug>`, keeps the prefix when the branch is renamed before the pull request, and rejects `--branch` together with `--prefix`."
- "`ralph prompt --prefix` skips successfully when an open pull request has a head branch starting with `<prefix>/` on any base branch, prints the matches, and exits zero before any slug, branch, before command, service, or pass work. A failed listing fails the command."
- "A prefixed prompt adds `[<prefix>] ` to the pull request title without repeating the prefix in the branch-name fallback."
- "`ralph prompt --prefix` in remote mode checks the prefix locally before submission, sends the prefix to the workflow, and the container checks it again before its work."
- "`ralph workflow prompt` accepts a prefix without a branch, clones the branch named by `--clone`, checks the prefix, proposes a prompt slug, and creates and runs on `<prefix>/<prompt-slug>`. A supplied branch must start with `<prefix>/`."
- "The launcher chart reads `prompt.entries`, gives each entry its own ConfigMap key, requires a slug and text, supports optional events, rejects duplicate slugs, and no longer exposes `prompt.branch`, `prompt.text`, `prompt.configMapKey`, or `sensor.events`."
- "The launcher maps each entry and event pair to a workflow trigger, defaults omitted events to `push`, and accepts an empty event list as every event."
- "The launcher applies `defaultBranchOnly` only to push dependencies and applies ignore-users and extra filters to every entry."
- "The launcher passes each entry slug as `--prefix` with no branch and keys each workflow mutex by the prefix so runs of the same entry serialize."
- "Apply a semver minor bump to the app version."
- "Apply a semver minor bump to the `ralph-launcher` chart version and set its appVersion to the new app version."
