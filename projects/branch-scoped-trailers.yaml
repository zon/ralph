- "Completion trailers are bare `<branch>-<index>` lines: an item's project branch and 0-based index joined with a hyphen, for example `csv-export-2`, with no `Ralph item ... completed` wrapper and no key. The trailer formatter emits this line from a branch and an index, and the parser extracts the branch and the index from it."
- "Reading completion is scoped to the current branch. When completion is read from the commit log, only trailers whose branch matches the current branch count; a trailer from any other branch is ignored without a warning, so a project branched from another project's branch never inherits that project's completion. Both `ralph get` subcommands and the iteration loop apply the same filter."
- "The development agent is told the exact trailer line to write. Its prompt supplies `<branch>-<index>` built from the project branch and the selected item's index, and the development and picker instructions describe trailers as bare `<branch>-<index>` lines and note that a trailer naming a different branch is not evidence of completion."
- "The user-facing documentation reflects the new trailer: `docs/iterations.md`, `docs/glossary.md`, `docs/projects.md`, `docs/config.md`, `docs/cli.md`, and `README.md` describe the trailer as `<branch>-<index>` and drop the key-mismatch warning that existed when the trailer carried the key."
- "The test suite covers the new trailer format and branch scoping: formatting and parsing of `<branch>-<index>`, current-branch trailers honored, other-branch trailers ignored, out-of-range indices warned about, and the prompt supplying the exact trailer line. Tests asserting the old `Ralph item ... completed` form are updated or removed."
