- '`ralph setup` first confirms the local machine is ready to run Ralph and stops at the first failure. The git check passes only when git is installed, the current directory is inside a git repository, and `user.name` and `user.email` are configured. The GitHub CLI check passes only when `gh` is installed and a token is available from the `gh` login or `GITHUB_TOKEN`. The OpenCode check passes only when OpenCode is installed and its `auth.json` holds credentials. A failed check names the tool that is not ready, aborts setup, and runs no later check and no cluster work. Cover the Sequential Local Readiness Confirmation scenarios in specs/ralph/setup.md.'
- '`ralph setup` prepares a Kubernetes namespace for Ralph workflows only when the local readiness checks all pass and a namespace is available, taking it from `-n`/`--namespace` when given and otherwise from `workflow.namespace` in `.ralph/config.yaml`. The flag wins over the config value. When no namespace is available from either source, setup skips namespace preparation, exits successfully on the local checks alone, and does not require kubectl or a cluster. It never uses the kubeconfig context''s default namespace to trigger preparation. Cover the Namespace-Triggered Preparation scenarios in specs/ralph/setup.md.'
- 'When `ralph setup` prepares a namespace it targets the cluster chosen by `--context`, then `workflow.context` in `.ralph/config.yaml`, then the current kubeconfig context, and writes the GitHub and OpenCode credential Secrets into the targeted namespace in order: the GitHub credentials first, then the OpenCode `auth.json`. A failed step halts preparation, so a GitHub credential failure skips the OpenCode step. Cover the Sequential Namespace Preparation and Kubernetes Context Targeting scenarios in specs/ralph/setup.md.'
- During namespace preparation the GitHub credential flags keep their current behavior. `--github-key <key.pem>` validates the key against the GitHub API and writes it as `app-id` and `private-key`. `--github-token <token>` writes the `token` key without validation. The two flags are mutually exclusive and error before any step when both are given. With no flag, an existing GitHub Secret in the target namespace is reused, and a missing one falls back to the `gh` login token, then `GITHUB_TOKEN`, writing the found token to the Secret. Passing `--github-key` or `--github-token` when no namespace is targeted returns an error explaining that writing credentials requires a targeted namespace. Cover the GitHub Key Flag and GitHub Token Flag scenarios in specs/ralph/setup.md.
- Update the `ralph setup` help description and the README Setup and Remote workflows sections so they describe confirming that git, `gh`, and OpenCode are ready to run Ralph and preparing a namespace only when one is targeted, instead of presenting setup as a one-shot remote credential configuration.
- Apply a semver minor bump to the app version.
