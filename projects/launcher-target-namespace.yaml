- "A Ralph command that runs in a pod with no kubeconfig reaches its own cluster with the pod's ServiceAccount and needs no kubectl context. It ignores `--context` and `workflow.context`. The namespace still resolves from `--namespace`, then `workflow.namespace`, and falls back to the pod's own namespace when neither is set. A command with a kubeconfig resolves its context and namespace as before."
- "`ralph workflow prompt` accepts `--namespace <namespace>` and lists it in its usage. Without the flag the command behaves as before and runs the prompt in its own pod."
- "`ralph workflow prompt --namespace <namespace>` prepares the workspace with GitHub authentication and the clone of the `--clone` branch, then checks for an open pull request at the prefix. A match ends the command successfully with no workflow submitted. With no match, it runs the prompt as a remote run from the clone and submits a `ralph-prompt-` workflow into the target namespace, after it proposes the prompt slug, resolves the prompt branch and base branch, and checks base branch synchronization. It runs no prompt pass in its own pod."
- "The workflow that `ralph workflow prompt --namespace` submits takes its image, mounts, environment, labels, and resources from the `.ralph/config.yaml` of the cloned branch, so a config change on that branch reaches the next run with no launcher release. The `--namespace` flag wins over `workflow.namespace` in that config, and `workflow.context` in that config does not apply."
- "`ralph workflow prompt --namespace <namespace>` follows the target workflow's logs to its output and waits for the workflow to finish, with completion notifications off. It exits zero when the target workflow succeeds and non-zero when it fails. Stopping the launcher workflow leaves the target workflow running."
- "The `ralph-launcher` chart reads an optional `namespace` on each `prompt.entries` item. With it set, the entry's workflow receives the namespace as a parameter and passes it to `ralph workflow prompt` as `--namespace`. With it unset, the workflow passes no `--namespace` and the entry runs in the launcher pod as before. Entries can name different namespaces, and the same launcher can hold targeted and untargeted entries."
- "The `ralph-launcher` chart renders a Role and a RoleBinding for the workflow ServiceAccount in each distinct target namespace named by an entry. Entries that share a namespace share one Role and one RoleBinding. The Role allows `create`, `get`, `list`, and `watch` on workflows, and `get`, `list`, and `watch` on pods and pod logs, and nothing else. With `target.rbac.create` set to `false`, the chart renders no target Role or RoleBinding. A release whose entries name no namespace renders none either."
- "A `ralph-launcher` release whose entries all name a target namespace can leave `workflow.credentials.opencodeSecret` empty. The launcher pod then mounts no OpenCode Secret, starts, prepares its workspace without loading OpenCode credentials, and submits the target workflow. A release that sets `workflow.credentials.opencodeSecret` mounts the Secret at `/secrets/opencode` as before."
- "Document the entry `namespace`, `target.rbac.create`, and the empty `workflow.credentials.opencodeSecret` case in the `ralph-launcher` values comments. The comments say that a targeted entry runs the agent with the repository's own `.ralph/config.yaml`, that the target must be a namespace of the launcher's own cluster, and that `target.rbac.create: false` leaves the operator to grant the rights. The `ralph-launcher` release notes name each target namespace and the entries that use it."
- "Apply a semver minor bump to the Ralph app version, and a semver minor bump to the `ralph-launcher` chart version with its `appVersion` set to the new app version."
