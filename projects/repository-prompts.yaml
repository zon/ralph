- ".ralph/config.yaml accepts a top-level `prompts` map. A value is either prompt text or a mapping with a `file` path relative to the repository root. Keys are lower camel case GitHub events or `schedule`. Lookup lowercases the event and each key and removes `_` and `-` before comparing them. The launcher fails with an error that names both keys when two keys normalize alike. An event with no key, or a prompt that is empty or names a missing or empty file, fails with an error that names the event. `ralph help config` documents the section, and other commands ignore it."
- "`ralph workflow prompt` accepts `--event <event>`. With an event and no prompt, it prepares the workspace, resolves the event's prompt from the cloned repository's `.ralph/config.yaml`, and fails before any branch, service, or pass work when the key is missing or the prompt is empty. A supplied prompt still runs without an event, and a supplied prompt wins when both are given."
- "The `ralph-launcher` chart reads `prompt.events` in place of `prompt.entries`. It defaults to `[push]` when the launcher has no schedule and the key is absent. An absent key with a schedule handles no events, and an empty list accepts every event. The chart rejects an empty event name and duplicate event names, and it renders no sensor when the launcher handles no events. The chart holds no prompt text."
- "The launcher sensor renders one dependency and trigger per event. Each trigger passes the event name as `--prefix` and `--event` and sends no prompt text. An empty event list renders one dependency with no event filter, reads the delivered event name from the subject or bus delivery data, and uses it for the event, prefix, workflow name, and mutex. The default branch filter applies only to push, and the global ignore and filter settings apply to every dependency."
- "The launcher `WorkflowTemplate` takes the event, prefix, base, repository, clone branch, target namespace, and name prefix, and passes `--event` to the container without a prompt argument. The chart no longer renders or deploys the prompt ConfigMap, and its template is removed. Workflow and target agent workflow names use the event: `<prefix>-<event>-launcher-<random>` and `<prefix>-<event>-<random>`. Event mutexes use the normalized event, and `workflow.mutex.name` overrides them."
- "The `ralph-launcher` chart reads `prompt.schedule` as one cron expression or a list in place of the per-entry schedule. It renders one CronWorkflow named `<prefix>-schedule-cron-launcher` with `concurrencyPolicy: Forbid`, the configured `schedule.timezone`, and the same labels, TTL, pod garbage collection, and workflow body as an event trigger. Each run passes `--event schedule` and uses the `schedule` prefix and mutex, which does not block or wait for an event run."
- "The `ralph-launcher` chart reads `target.namespace` in place of the per-entry namespace. Every run targets it, and it defaults to the release namespace. The chart passes it to the workflow as `--namespace` and renders one Role and RoleBinding in that namespace for the workflow ServiceAccount when `target.rbac.create` is true."
- "The launcher release notes describe the event work streams, the schedule, the target namespace, and the repository prompt keys. They name no prompt ConfigMap, entry slug, or per-entry namespace."
- "Apply a semver minor bump to the Ralph app version and a semver major bump to the `ralph-launcher` chart version, setting the chart's `appVersion` to the new Ralph version."
