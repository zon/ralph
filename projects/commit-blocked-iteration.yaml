# Commit a blocked iteration and stop, and stage the diff before the
# changelog prompt. Spec: the Iteration loop and Commit after each iteration
# requirements in `specs/ralph/run-local.md`. Build to it.
#
# Why. When the development agent writes `blocked.md` and no `report.md`,
# the commit step sees an untracked file, treats it as ordinary changes, and
# asks the changelog agent to describe the staged diff. Nothing is staged
# until the commit itself, so the agent finds an empty diff, declines to
# invent an entry, and the run dies with `no usable deliverable after the
# 3-attempt limit: output file is empty`. The run never reaches the blocked
# check at the top of the next iteration, `blocked.md` is never committed,
# and the reason the agent stopped is lost with the pod. `README.md` already
# promises that Ralph asks for help by committing `blocked.md`.
#
# Where things are. `internal/orchestration/run/runner.go`'s `iterate`
# checks for `blocked.md` at the start of each iteration and
# `commitIteration` decides between `report.md`, the changelog, and no
# commit. `internal/git/client.go` holds `BlockedFileExists`, `ReportExists`,
# and `CommitFromReport`, and `internal/git/commit.go` stages and commits.
# `internal/ai/ai.go`'s `GenerateChangelog` runs the prompt in
# `internal/ai/changelog-instructions.md`. The run tests and their mocks are
# in `internal/orchestration/run`, following `docs/testing.md`.
#
# Applying. Nothing here touches a cluster. The behavior change lands with
# the release.
- "When an item iteration in `ralph run` leaves `blocked.md` in the repository root, the commit step commits `blocked.md` together with every other change in the working tree, and never invokes the changelog agent. When no `report.md` exists, the commit message is the content of `blocked.md`. When `report.md` also exists, it stays the commit message and is removed before the commit as today, and `blocked.md` is still committed. `blocked.md` remains in the working tree after the commit. Run tests cover a blocked iteration with other changes, with `report.md`, and with nothing else changed."
- "After committing an iteration that left `blocked.md`, `ralph run` stops with the blocked error without starting another iteration, even when iterations remain in the limit, so the picker is not invoked again. A run started later against a branch that already carries `blocked.md` still stops with the blocked error before invoking the AI. Run tests cover both."
- "Before the changelog agent runs for an iteration with changes and no `report.md`, `ralph run` stages every change in the working tree, including untracked files, so the staged diff the changelog prompt asks the agent to describe holds the whole iteration's changes. Run tests cover the staging happening before the changelog agent is invoked."
- "Apply a semver patch bump to the app version."
