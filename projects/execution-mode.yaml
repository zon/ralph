- .ralph/config.yaml accepts a top-level `mode` field set to `local`, `worktree`, or `remote`. When `mode` is unset it defaults to `worktree`. `--mode` on the command line takes priority over the config value. A `mode` value other than `local`, `worktree`, or `remote` is rejected with a descriptive error before any execution begins.
- The git client provides worktree operations that create a Git worktree for a branch in a sibling directory of the current repository named from the branch, detect that a branch is already checked out in another worktree, and remove a worktree. Every operation supports a dry-run mode that returns inspectable state describing the git command it would run, and tests assert on that state.
- The `ralph run` command replaces the `--local` flag with `--mode`. `--mode local` runs the development loop in-process in the current checkout and `--mode remote` submits an Argo Workflow, matching their previous behavior. Bare `ralph run` resolves the mode as `--mode` flag, then the `mode` field in `.ralph/config.yaml`, then `worktree`. `--follow` and `--debug` are rejected for `local` and `worktree` modes with descriptive errors. `scripts/run-projects.sh` passes `--mode remote` so its projects keep running concurrently on the cluster.
- The `ralph run --mode worktree` command creates a Git worktree for the project branch in a sibling directory, runs the full development loop in-process inside it, and removes the worktree when the run ends, whether it succeeds or fails, leaving the current checkout untouched. When the project branch is already checked out in another worktree, the command returns an error and no worktree is created.
- The `ralph loop` command replaces the `--local` flag with `--mode` using the same three modes and the same flag/config/worktree default resolution as `ralph run`, and rejects `--follow` for `local` and `worktree` modes. Worktree mode creates a worktree on the `loop-<slug>` branch, runs the loop in-process inside it, and removes the worktree when the loop ends.
- Apply a semver major bump to the app version.
