nameOverride: ""
fullnameOverride: ""

routing:
  # Render the repository routing sensors and the stream job. Defaults to true.
  # A cluster whose launchers all use delivery: bus sets routing.enabled to
  # false. The release still renders the GitHub event source and the event bus.
  # The stream settings below apply only while routing is enabled.
  enabled: true

# Repositories routed from GitHub to NATS. Each entry creates one sensor that
# filters the shared GitHub event source by repository and publishes the event
# body to ralph.repo.<owner>.<name> unless subject overrides it.
repositories:
  - owner: zon
    name: ralph
    subject: ""
    # GitHub event names to route. Use an empty list for every event, or a
    # list such as [push] or [push, pull_request].
    events: []
    filters: []

nats:
  # Existing NATS JetStream server on the cluster. This chart does not install
  # NATS. Use a URL reachable from every namespace that runs a launcher.
  url: ""
  auth:
    # Existing Secret with the NATS username and password. The repo routing
    # sensors and the stream job read this Secret.
    secret:
      name: ""
      usernameKey: username
      passwordKey: password

stream:
  # Create the JetStream stream that retains repository events for launchers.
  # The job leaves an existing stream unchanged, so edit the stream by hand
  # after changing subjects.
  create: true
  name: RALPH
  subjects:
    - "ralph.repo.>"
  storage: file
  retention: limits
  maxAge: "168h"
  maxBytes: "-1"
  replicas: 1
  job:
    image:
      repository: natsio/nats-box
      tag: "0.20.2"
      pullPolicy: IfNotPresent
    backoffLimit: 6
    activeDeadlineSeconds: 300

eventbus:
  # Create the EventBus in the release namespace that the GitHub event source
  # and the repo routing sensors use. Set create to false when another release
  # in the namespace owns the bus.
  create: true
  name: default
  # Create one EventBus per entry and skip the release-namespace bus. Each
  # entry needs a namespace, a name, and an accessSecret.
  instances: []
  # Existing Secret and key holding the EventBus credentials file
  # (username and password).
  accessSecret: {}
  jetstream:
    streamConfig: |
      maxAge: 24h
      replicas: 1

github:
  # Defaults to the release full name.
  eventSourceName: ""
  # Events GitHub sends to the webhook. Use ["*"] for every event.
  events:
    - "*"
  contentType: json
  webhook:
    endpoint: /github
    port: 12000
    method: POST
    # The public URL GitHub calls. Required when apiTokenSecret is set so
    # Argo Events can register the webhook automatically.
    url: ""
    insecure: false
    active: true
    # Delete the webhooks the release registered when the event source stops.
    # Defaults to false, which leaves the hooks in place. Applies only when the
    # chart registers hooks, which needs apiTokenSecret or githubApp with
    # github.webhook.url. A crash can leave a hook behind. With true, a
    # repository removed from repositories loses its webhook on the next
    # restart.
    deleteHookOnFinish: false
    # Serve the webhook over TLS. Off by default: leave secretName empty and the
    # event source serves plain HTTP. When set, the Secret holds the server
    # certificate and key, and github.webhook.url must use https.
    tls:
      secretName: ""
      certKey: tls.crt
      keyKey: tls.key
      # Create a cert-manager Certificate that fills the Secret. Off by
      # default: leave this empty and the operator supplies the Secret. Set
      # issuerRef to name the issuer and its kind. dnsNames defaults to the
      # host of github.webhook.url.
      certificate: {}
  # Existing Secret holding a GitHub API token. When set, Argo Events registers
  # webhooks for the repositories below.
  apiTokenSecret: {}
  # GitHub App credentials for webhook registration. Takes the place of
  # apiTokenSecret.
  githubApp:
    appID: 0
    installationID: 0
    privateKeySecret: {}
  # Existing Secret holding the GitHub webhook HMAC secret.
  webhookSecret: {}

sensor:
  # Extra sensor template settings.
  serviceAccountName: ""
  trigger:
    retry:
      steps: 3

# Render a Gateway API TLSRoute that passes TLS through by SNI to the event
# source on the webhook port. Off by default: leave this empty and the release
# renders no route. Requires github.webhook.tls. Each parentRefs entry passes
# through as written, including sectionName. hostnames defaults to the host of
# github.webhook.url, and apiVersion defaults to gateway.networking.k8s.io/v1.
gatewayRoute: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: ralph-events.example.com
      paths:
        - path: /github
          pathType: Prefix
  tls: []
