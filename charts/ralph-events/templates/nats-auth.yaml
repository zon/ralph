{{- if and .Values.nats.auth.serviceAccount.create (not .Values.nats.auth.tokenSecret.name) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ralph-events.natsServiceAccountName" . }}
  labels:
    {{- include "ralph-events.labels" . | nindent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ralph-events.natsTokenSecretName" . }}
  labels:
    {{- include "ralph-events.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: {{ include "ralph-events.natsServiceAccountName" . }}
type: kubernetes.io/service-account-token
{{- end }}
