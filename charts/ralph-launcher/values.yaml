nameOverride: ""
fullnameOverride: ""

# delivery selects how repository events reach this launcher. Use subject to
# subscribe to the repository subject and republish it to the namespace bus, or
# bus to read the intake's GitHub event source through the shared event bus.
# Defaults to subject. The chart rejects any other value.
delivery: subject

intake:
  # The ralph-events release's GitHub event source. With delivery: bus,
  # intake.eventSource.name is required and the launcher sensor names this
  # event source in its dependencies.
  eventSource:
    name: ""
  # The event name inside the intake event source. intake.eventName defaults
  # to github.
  eventName: github

nats:
  # Existing NATS JetStream server on the cluster. The chart does not install
  # NATS. Use the same URL as ralph-events, for example:
  # nats://nats.argo-events.svc.cluster.local:4222
  url: ""
  auth:
    # Existing Secret with the NATS username and password. The NATS event
    # source reads this Secret.
    secret:
      name: ""
      usernameKey: username
      passwordKey: password
  # Defaults to ralph.repo.<owner>.<name>.
  subject: ""
  # Maximum reconnect attempts for the NATS event source. A negative value
  # keeps reconnecting forever.
  maxReconnects: -1

repo:
  owner: zon
  name: ralph
  cloneBranch: main
  baseBranch: main

prompt:
  # Each entry starts a workflow with its slug as the work-stream prefix and
  # its text as the prompt.
  #
  # events lists the GitHub event names that start the entry. When omitted, an
  # entry with a schedule starts no workflows from events, and an entry without
  # a schedule starts on push. An empty events list accepts every event.
  #
  # schedule holds one cron expression or a list of expressions, for example
  # "0 8 * * *". The chart renders one CronWorkflow for each scheduled entry.
  # An entry may combine events and schedule.
  #
  # namespace names the namespace the entry's agent workflow runs in. The agent
  # runs with the repository's own .ralph/config.yaml. When omitted, the entry
  # targets the release namespace. The namespace must belong to the launcher's
  # own cluster.
  entries:
    - slug: review
      text: |
        Review the repository and make one small improvement.
      # schedule: "0 8 * * *"
      # namespace: ralph

schedule:
  # schedule.timezone sets the time zone for every prompt entry schedule, for
  # example America/New_York. Leave empty to use the Argo Workflows controller's
  # time zone.
  timezone: ""

image:
  repository: ghcr.io/zon/ralph
  tag: ""
  pullPolicy: IfNotPresent

workflow:
  serviceAccountName: ""
  model: ""
  variant: ""
  agent: ""
  noServices: false
  verbose: false
  # Kubernetes labels applied to each launcher Workflow and its pod.
  labels: {}
  env: []
  resources: {}
  ttlSecondsAfterCompletion: 86400
  podGC:
    strategy: OnWorkflowCompletion
    deleteDelayDuration: 10m
  mutex:
    enabled: true
    name: ""
  credentials:
    githubSecret: github-credentials
    # opencodeSecret names the Secret mounted at /secrets/opencode. The launcher
    # pod never runs the agent and never calls a model, because the target
    # workflow proposes the prompt slug. It can leave this empty. The pod then
    # mounts no OpenCode Secret and carries no agent credentials.
    opencodeSecret: opencode-credentials
  extraVolumes: []
  extraVolumeMounts: []

target:
  # rbac.create renders a Role and RoleBinding for the workflow ServiceAccount
  # in each target namespace, including the release namespace when an entry
  # sets no namespace. Set it to false to have the operator grant the rights
  # another way.
  rbac:
    create: true

eventBus:
  # Create an Argo Events EventBus in this namespace that uses the existing
  # NATS JetStream server. Set create to true only when no other release in the
  # namespace owns the bus.
  create: false
  name: default
  # Existing Secret and key holding the EventBus credentials file
  # (username and password).
  accessSecret: {}
  # eventBus.streamConfig sets the JetStream settings for a bus that this
  # release creates. maxAge is the bus stream retention window: a returning bus
  # sensor receives the events retained within it, and an older event is lost.
  # Delivery is at least once, so a launcher can see an event twice; the open
  # pull request check and the entry mutex stop a repeat from starting a second
  # pass.
  streamConfig: |
    maxAge: 24h
    replicas: 1

sensor:
  eventSource:
    # Render the launcher event source that subscribes to the repository
    # subject. It is rendered only with delivery: subject.
    create: true
    name: ""
    connectionBackoff:
      duration: 1s
      factor: 2
      steps: 5
  replicas: 1
  # Only run an entry's push dependency for pushes to the base branch. This
  # applies on either delivery path. Set to false to run on every push
  # delivered by the chosen path.
  defaultBranchOnly: true
  # The branch filter follows repo.baseBranch on either delivery path. Set
  # branch to override the ref it matches.
  branch: ""
  # Pushes from these GitHub users do not start another prompt run on either
  # delivery path.
  ignoreUsers:
    - "ralph-zon[bot]"
  # Additional Argo Events data filters. Paths in sensor.filters are relative
  # to the data of the chosen delivery path. With delivery: subject the event
  # name is body.event and the GitHub body is body.payload. With delivery: bus
  # the data is the GitHub delivery itself: the repository is
  # body.repository.full_name, the event name is the X-Github-Event header, the
  # push branch is body.ref, and the sender is body.sender.login. Rewrite paths
  # when switching delivery.
  filters: []
  retry:
    steps: 3
  serviceAccount:
    create: true
    name: ""
  rbac:
    create: true

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
