nameOverride: ""
fullnameOverride: ""

nats:
  # Existing NATS JetStream server on the cluster. The chart does not install
  # NATS. Use the same URL as ralph-events, for example:
  # nats://nats.argo-events.svc.cluster.local:4222
  url: ""
  auth:
    # Existing Secret with the NATS username and password. The NATS event
    # source reads this Secret.
    secret:
      name: ""
      usernameKey: username
      passwordKey: password
  # Defaults to ralph.repo.<owner>.<name>.
  subject: ""
  # Maximum reconnect attempts for the NATS event source. A negative value
  # keeps reconnecting forever.
  maxReconnects: -1

repo:
  owner: zon
  name: ralph
  cloneBranch: main
  baseBranch: main

prompt:
  # Each entry starts a workflow with its slug as the work-stream prefix and
  # its text as the prompt. events lists the GitHub event names that start the
  # entry. When omitted, an entry with a schedule starts no workflows from
  # events, and an entry without a schedule starts on push. An empty events list
  # accepts every event. schedule holds one cron expression or a list of
  # expressions.
  entries:
    - slug: review
      text: |
        Review the repository and make one small improvement.

schedule:
  # schedule.timezone applies one time zone to every prompt entry schedule, for
  # example America/New_York. Leave empty to use the Argo Workflows controller's
  # time zone.
  timezone: ""

image:
  repository: ghcr.io/zon/ralph
  tag: ""
  pullPolicy: IfNotPresent

workflow:
  serviceAccountName: ""
  model: ""
  variant: ""
  agent: ""
  noServices: false
  verbose: false
  # Kubernetes labels applied to each launcher Workflow and its pod.
  labels: {}
  env: []
  resources: {}
  ttlSecondsAfterCompletion: 86400
  podGC:
    strategy: OnWorkflowCompletion
    deleteDelayDuration: 10m
  mutex:
    enabled: true
    name: ""
  credentials:
    githubSecret: github-credentials
    opencodeSecret: opencode-credentials
  extraVolumes: []
  extraVolumeMounts: []

eventBus:
  # Create an Argo Events EventBus in this namespace that uses the existing
  # NATS JetStream server. Set create to true only when no other release in the
  # namespace owns the bus.
  create: false
  name: default
  # Existing Secret and key holding the EventBus credentials file
  # (username and password).
  accessSecret: {}
  streamConfig: |
    maxAge: 24h
    replicas: 1

sensor:
  eventSource:
    create: true
    name: ""
    connectionBackoff:
      duration: 1s
      factor: 2
      steps: 5
  replicas: 1
  # Only run an entry's push dependency for pushes to the base branch. Set to
  # false to run on every push delivered to the repository subject.
  defaultBranchOnly: true
  # The branch filter follows repo.baseBranch. Set branch to override it.
  branch: ""
  # Pushes from these GitHub users do not start another prompt run.
  ignoreUsers:
    - "ralph-zon[bot]"
  # Additional Argo Events data filters. Paths are relative to the NATS event
  # data, whose event key holds the GitHub event name and payload key holds the
  # GitHub event body.
  filters: []
  retry:
    steps: 3
  serviceAccount:
    create: true
    name: ""
  rbac:
    create: true

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
