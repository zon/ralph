{{- include "ralph-launcher.validatePromptEntries" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ralph-launcher.fullname" . }}-prompt
  labels:
    {{- include "ralph-launcher.labels" . | nindent 4 }}
    workflows.argoproj.io/configmap-type: Parameter
data:
{{- range $entry := .Values.prompt.entries }}
  {{ $entry.slug | quote }}: |
{{ $entry.text | indent 4 }}
{{- end }}
