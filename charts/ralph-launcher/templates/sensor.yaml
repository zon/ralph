{{- include "ralph-launcher.validatePromptEntries" . -}}
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: {{ include "ralph-launcher.sensorName" . }}
  labels:
    {{- include "ralph-launcher.labels" . | nindent 4 }}
spec:
  eventBusName: {{ .Values.eventBus.name }}
  replicas: {{ .Values.sensor.replicas }}
  template:
    serviceAccountName: {{ include "ralph-launcher.serviceAccountName" . }}
  dependencies:
    {{- range $entry := .Values.prompt.entries }}
    {{- $events := include "ralph-launcher.entryEvents" $entry | fromJsonArray }}
    {{- range $event := $events }}
    - name: {{ include "ralph-launcher.entryName" (dict "slug" $entry.slug "event" $event) | quote }}
      eventSourceName: {{ include "ralph-launcher.eventSourceName" $ }}
      eventName: repo
      {{- include "ralph-launcher.dependencyFilters" (dict "root" $ "event" $event) | nindent 6 }}
    {{- end }}
    {{- end }}
  triggers:
    {{- range $entry := .Values.prompt.entries }}
    {{- $events := include "ralph-launcher.entryEvents" $entry | fromJsonArray }}
    {{- range $event := $events }}
    {{- $name := include "ralph-launcher.entryName" (dict "slug" $entry.slug "event" $event) }}
    - template:
        name: {{ $name | quote }}
        conditions: {{ $name | quote }}
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: {{ printf "ralph-prompt-%s-" (include "ralph-launcher.name" $) | quote }}
                labels:
                  app.kubernetes.io/managed-by: ralph
                  app.kubernetes.io/name: {{ include "ralph-launcher.name" $ | quote }}
                  app.kubernetes.io/instance: {{ $.Release.Name | quote }}
                  {{- with $.Values.workflow.labels }}
                  {{- toYaml . | nindent 18 }}
                  {{- end }}
              spec:
                workflowTemplateRef:
                  name: {{ include "ralph-launcher.fullname" $ }}
                arguments:
                  parameters:
                    {{- include "ralph-launcher.workflowParameters" (dict "root" $ "entry" $entry) | nindent 20 }}
                ttlStrategy:
                  secondsAfterCompletion: {{ $.Values.workflow.ttlSecondsAfterCompletion }}
                podGC:
                  strategy: {{ $.Values.workflow.podGC.strategy | quote }}
                  deleteDelayDuration: {{ $.Values.workflow.podGC.deleteDelayDuration | quote }}
                {{- if $.Values.workflow.mutex.enabled }}
                synchronization:
                  mutexes:
                    - name: {{ include "ralph-launcher.mutexName" (dict "root" $ "entry" $entry) | quote }}
                {{- end }}
        retryStrategy:
          steps: {{ $.Values.sensor.retry.steps }}
    {{- end }}
    {{- end }}
