{{- include "ralph-launcher.validatePrompt" . -}}
{{- $events := include "ralph-launcher.promptEvents" . | fromJsonArray -}}
{{- if $events -}}
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: {{ include "ralph-launcher.sensorName" . }}
  labels:
    {{- include "ralph-launcher.labels" . | nindent 4 }}
spec:
  eventBusName: {{ .Values.eventBus.name }}
  replicas: {{ .Values.sensor.replicas }}
  template:
    serviceAccountName: {{ include "ralph-launcher.serviceAccountName" . }}
  dependencies:
    {{- range $event := $events }}
    - name: {{ include "ralph-launcher.dependencyName" (dict "event" $event) | quote }}
      eventSourceName: {{ include "ralph-launcher.dependencyEventSourceName" $ }}
      eventName: {{ include "ralph-launcher.dependencyEventName" $ }}
      {{- include "ralph-launcher.dependencyFilters" (dict "root" $ "event" $event) | nindent 6 }}
    {{- end }}
  triggers:
    {{- range $event := $events }}
    {{- $name := include "ralph-launcher.dependencyName" (dict "event" $event) }}
    {{- $generateName := printf "%s-launcher-" (include "ralph-launcher.eventWorkflowBase" (dict "root" $ "event" $event)) }}
    {{- if not $event }}
    {{- $generateName = printf "%s-" (include "ralph-launcher.prefix" $) }}
    {{- end }}
    - template:
        name: {{ $name | quote }}
        conditions: {{ $name | quote }}
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              {{- include "ralph-launcher.workflowSettings" (dict "root" $ "event" $event "metadataKey" "metadata" "specKey" "spec" "generateName" $generateName) | nindent 14 }}
          {{ if not $event }}
          {{- $eventPath := ternary "headers.X-Github-Event.0" "body.event" (eq (include "ralph-launcher.delivery" $) "bus") -}}
          {{- $inputPath := ternary "first (index .Input.headers \"X-Github-Event\")" ".Input.body.event" (eq (include "ralph-launcher.delivery" $) "bus") -}}
          {{- $normalized := printf "{{ %s | lower | replace \".\" \"-\" | replace \"_\" \"-\" | replace \"/\" \"-\" | trunc 63 | trimSuffix \"-\" }}" $inputPath -}}
          {{- $workflowSuffix := printf "%s-launcher-" $normalized -}}
          parameters:
            - src:
                dependencyName: {{ $name | quote }}
                dataKey: {{ $eventPath | quote }}
              dest: spec.arguments.parameters.2.value
            - src:
                dependencyName: {{ $name | quote }}
                dataKey: {{ $eventPath | quote }}
              dest: spec.arguments.parameters.5.value
            - src:
                dependencyName: {{ $name | quote }}
                dataTemplate: {{ $workflowSuffix | quote }}
              dest: metadata.generateName
              operation: append
            {{- if and $.Values.workflow.mutex.enabled (not $.Values.workflow.mutex.name) }}
            - src:
                dependencyName: {{ $name | quote }}
                dataTemplate: {{ $normalized | quote }}
              dest: spec.synchronization.mutexes.0.name
            {{- end }}
          {{- end }}
        retryStrategy:
          steps: {{ $.Values.sensor.retry.steps }}
    {{- end }}
{{- end }}
