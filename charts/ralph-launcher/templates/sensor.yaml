apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: {{ include "ralph-launcher.sensorName" . }}
  labels:
    {{- include "ralph-launcher.labels" . | nindent 4 }}
spec:
  eventBusName: {{ .Values.eventBus.name }}
  replicas: {{ .Values.sensor.replicas }}
  template:
    serviceAccountName: {{ include "ralph-launcher.serviceAccountName" . }}
  dependencies:
    - name: repo
      eventSourceName: {{ include "ralph-launcher.eventSourceName" . }}
      eventName: repo
      {{- if or .Values.sensor.events .Values.sensor.defaultBranchOnly .Values.sensor.ignoreUsers .Values.sensor.filters }}
      filters:
        data:
          {{- with .Values.sensor.events }}
          - path: body.event
            type: string
            value:
              {{- range . }}
              - {{ . | quote }}
              {{- end }}
          {{- end }}
          {{- if .Values.sensor.defaultBranchOnly }}
          - path: body.payload.ref
            type: string
            value:
              - {{ include "ralph-launcher.pushRef" . | quote }}
          {{- end }}
          {{- range .Values.sensor.ignoreUsers }}
          - path: body.payload.sender.login
            type: string
            comparator: "!="
            value:
              - {{ . | quote }}
          {{- end }}
          {{- with .Values.sensor.filters }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
      {{- end }}
  triggers:
    - template:
        name: ralph-prompt
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: {{ printf "ralph-prompt-%s-" (include "ralph-launcher.name" .) | quote }}
                labels:
                  app.kubernetes.io/managed-by: ralph
                  app.kubernetes.io/name: {{ include "ralph-launcher.name" . | quote }}
                  app.kubernetes.io/instance: {{ .Release.Name | quote }}
                  {{- with .Values.workflow.labels }}
                  {{- toYaml . | nindent 18 }}
                  {{- end }}
              spec:
                workflowTemplateRef:
                  name: {{ include "ralph-launcher.fullname" . }}
                arguments:
                  parameters:
                    {{- include "ralph-launcher.workflowParameters" . | nindent 20 }}
                ttlStrategy:
                  secondsAfterCompletion: {{ .Values.workflow.ttlSecondsAfterCompletion }}
                podGC:
                  strategy: {{ .Values.workflow.podGC.strategy | quote }}
                  deleteDelayDuration: {{ .Values.workflow.podGC.deleteDelayDuration | quote }}
                {{- if .Values.workflow.mutex.enabled }}
                synchronization:
                  mutexes:
                    - name: {{ include "ralph-launcher.mutexName" . | quote }}
                {{- end }}
        retryStrategy:
          steps: {{ .Values.sensor.retry.steps }}
