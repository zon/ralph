{{- include "ralph-launcher.validatePrompt" . -}}
{{- $defaultEvent := include "ralph-launcher.defaultEvent" . -}}
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: {{ include "ralph-launcher.fullname" . }}
  labels:
    {{- include "ralph-launcher.labels" . | nindent 4 }}
spec:
  entrypoint: ralph-prompt
  arguments:
    parameters:
      {{- include "ralph-launcher.workflowParameters" (dict "root" . "event" $defaultEvent) | nindent 6 }}
  templates:
    {{- include "ralph-launcher.promptTemplate" (dict "root" .) | nindent 4 }}
