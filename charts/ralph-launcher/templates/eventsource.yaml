{{- if .Values.sensor.eventSource.create }}
apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: {{ include "ralph-launcher.eventSourceName" . }}
  labels:
    {{- include "ralph-launcher.labels" . | nindent 4 }}
spec:
  eventBusName: {{ .Values.eventBus.name }}
  nats:
    repo:
      url: {{ required "nats.url is required" .Values.nats.url | quote }}
      subject: {{ include "ralph-launcher.subject" . | quote }}
      {{- if .Values.nats.auth.tokenSecret.name }}
      auth:
        token:
          name: {{ .Values.nats.auth.tokenSecret.name | quote }}
          key: {{ default "token" .Values.nats.auth.tokenSecret.key | quote }}
      {{- end }}
      jsonBody: true
      maxReconnects: {{ .Values.nats.maxReconnects }}
      connectionBackoff:
        {{- toYaml .Values.sensor.eventSource.connectionBackoff | nindent 8 }}
{{- end }}
